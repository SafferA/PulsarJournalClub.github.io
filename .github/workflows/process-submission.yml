name: Process Website Submission and Votes

on:
  issues:
    types: [opened]

jobs:
  manage-platform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Issue Data
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          const title = process.env.ISSUE_TITLE.trim();
          const body = process.env.ISSUE_BODY;
          const currentIssueNum = process.env.ISSUE_NUMBER;
          
          let sites = [];
          if (fs.existsSync('sites.json')) {
            sites = JSON.parse(fs.readFileSync('sites.json', 'utf8'));
          }
          
          // CASE 1: Processing an incoming VOTE
          if (title.startsWith('[Vote]: ')) {
            const targetIssueNum = parseInt(title.replace('[Vote]: For Issue #', ''));
            
            const siteIndex = sites.findIndex(s => s.issue_number === targetIssueNum);
            if (siteIndex !== -1) {
              if (!sites[siteIndex].votes) sites[siteIndex].votes = 0;
              sites[siteIndex].votes += 1;
              console.log('Incremented vote for issue #' + targetIssueNum);
            }
            
            fs.writeFileSync('sites.json', JSON.stringify(sites, null, 2));
            
            // Clean up: Close the ballot issue automatically so your repo stays tidy!
            try {
              execSync('gh issue close ' + currentIssueNum + ' --reason \"completed\"');
            } catch (e) {
              console.log('Could not auto-close issue:', e.message);
            }
            process.exit(0);
          }
          
          // CASE 2: Processing a brand NEW SITE submission
          function extractUrl(text) {
            const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
            const match = text.match(urlRegex);
            return match ? match[0].trim() : '';
          }
          
          const siteUrl = extractUrl(body);
          
          if (!siteUrl) {
            console.error('Error: No valid URL found in submission.');
            process.exit(1);
          }
          
          if (sites.some(s => s.url === siteUrl)) {
            console.log('Site already exists!');
            process.exit(0);
          }
          
          sites.push({
            title: title,
            url: siteUrl,
            issue_number: parseInt(currentIssueNum),
            votes: 0
          });
          
          fs.writeFileSync('sites.json', JSON.stringify(sites, null, 2));
          "

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sites.json
          git commit -m "Automated Data Update [skip ci]"
          git push
