name: Process Website Submission

on:
  issues:
    types: [opened]

jobs:
  add-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update sites.json
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e "
          const fs = require('fs');
          
          const title = process.env.ISSUE_TITLE.trim();
          const body = process.env.ISSUE_BODY;
          const issueNumber = process.env.ISSUE_NUMBER;
          
          // 1. Ultra-forgiving URL Finder (Looks for anything resembling a website link in the text)
          function extractUrl(text) {
            const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
            const match = text.match(urlRegex);
            return match ? match[0].trim() : '';
          }
          
          const siteUrl = extractUrl(body);
          
          console.log('Detected Title:', title);
          console.log('Detected URL:', siteUrl);
          
          // 2. Safety Check: If they didn't even provide a link, we can't display it
          if (!siteUrl) {
            console.error('Error: Could not find a valid web link anywhere in the issue text.');
            process.exit(1);
          }
          
          // 3. Process and append data safely
          let sites = [];
          if (fs.existsSync('sites.json')) {
            sites = JSON.parse(fs.readFileSync('sites.json', 'utf8'));
          }
          
          // Prevent exact duplicate links
          if (sites.some(s => s.url === siteUrl)) {
            console.log('This link has already been submitted!');
            process.exit(0);
          }
          
          sites.push({
            title: title,
            url: siteUrl,
            issue_number: parseInt(issueNumber)
          });
          
          fs.writeFileSync('sites.json', JSON.stringify(sites, null, 2));
          "

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sites.json
          git commit -m "Automated: Logged entry from Issue #${{ github.event.issue.number }}"
          git push
