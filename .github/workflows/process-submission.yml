name: Process Website Submission

on:
  issues:
    types: [opened]

jobs:
  add-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse Issue Form
        id: parse
        uses: zofrex/issue-forms-body-parser@v1
        with:
          issue_id: ${{ github.event.issue.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update sites.json
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_DATA: ${{ steps.parse.outputs.json }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e "
          const fs = require('fs');
          
          // 1. Grab values safely from environment variables
          const title = process.env.ISSUE_TITLE;
          const issueNumber = process.env.ISSUE_NUMBER;
          
          // 2. Double check that this is actually a website submission
          if (!title.startsWith('[Submission]:')) {
            console.log('Not a submission issue. Exiting safely.');
            process.exit(0);
          }
          
          // 3. Process the data safely
          const issueData = JSON.parse(process.env.ISSUE_DATA);
          
          let sites = [];
          if (fs.existsSync('sites.json')) {
            sites = JSON.parse(fs.readFileSync('sites.json', 'utf8'));
          }
          
          if (sites.some(s => s.url === issueData.url)) {
            console.log('Site already exists!');
            process.exit(0);
          }
          
          sites.push({
            title: issueData.title.trim(),
            url: issueData.url.trim(),
            issue_number: parseInt(issueNumber)
          });
          
          fs.writeFileSync('sites.json', JSON.stringify(sites, null, 2));
          "

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sites.json
          git commit -m "Automated: Logged entry from Issue #${{ github.event.issue.number }}"
          git push
