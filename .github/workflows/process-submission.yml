name: Process Website Submission

on:
  issues:
    types: [opened]

jobs:
  add-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # We deleted the broken zofrex action step completely!

      - name: Update sites.json
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue. those values are hidden inside github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node -e "
          const fs = require('fs');
          
          const title = process.env.ISSUE_TITLE;
          const body = process.env.ISSUE_BODY;
          const issueNumber = process.env.ISSUE_NUMBER;
          
          // 1. Double check that this is actually a website submission
          if (!title.startsWith('[Submission]:')) {
            console.log('Not a submission issue. Exiting safely.');
            process.exit(0);
          }
          
          // 2. Custom robust Markdown parser for GitHub Issue Forms
          // It looks for headers like '### Website Title' or '### Website URL' and grabs the text below them
          function getFieldValue(markdown, fieldName) {
            const lines = markdown.split(/\r?\n/);
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].trim().includes('### ' + fieldName)) {
                // The answer is usually a line or two down, ignoring blank lines
                for (let j = i + 1; j < lines.length; j++) {
                  const val = lines[j].trim();
                  if (val && !val.startsWith('###')) return val;
                }
              }
            }
            return '';
          }
          
          const siteTitle = getFieldValue(body, 'Website Title');
          const siteUrl = getFieldValue(body, 'Website URL');
          
          if (!siteTitle || !siteUrl) {
            console.error('Error: Could not parse Title or URL from issue body.');
            process.exit(1);
          }
          
          // 3. Process the data safely
          let sites = [];
          if (fs.existsSync('sites.json')) {
            sites = JSON.parse(fs.readFileSync('sites.json', 'utf8'));
          }
          
          if (sites.some(s => s.url === siteUrl)) {
            console.log('Site already exists!');
            process.exit(0);
          }
          
          sites.push({
            title: siteTitle,
            url: siteUrl,
            issue_number: parseInt(issueNumber)
          });
          
          fs.writeFileSync('sites.json', JSON.stringify(sites, null, 2));
          "

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sites.json
          git commit -m "Automated: Logged entry from Issue #${{ github.event.issue.number }}"
          git push
