<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Vote Ranker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen pb-12">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center border-b border-gray-300 pb-6 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-indigo-600">GitRank</h1>
                <p class="text-gray-600">Instant, zero-account voting powered by CounterAPI.</p>
            </div>
            <a href="https://github.com/SafferA/PulsarJournalClub.github.io/issues/new" 
               target="_blank" 
               class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded shadow transition">
                + Submit Your Site
            </a>
        </header>

        <main id="sites-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-gray-500">Loading websites and tallying live votes...</p>
        </main>
    </div>

    <script>
        // CONFIGURATION: Set your unique workspace name here (use letters, numbers, hyphens)
        const WORKSPACE = "pulsar-journal-voter"; 

        async function init() {
            try {
                // 1. Fetch the basic site info from your repository's database file
                const response = await fetch('./sites.json');
                const sites = await response.json();

                const container = document.getElementById('sites-container');
                container.innerHTML = ''; 

                if (sites.length === 0) {
                    container.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-8">No submissions yet.</p>`;
                    return;
                }

                // 2. Fetch live vote tallies for each site simultaneously
                const fetchVotesPromises = sites.map(async (site) => {
                    // Each site gets its own unique tracking ID based on its issue number
                    const key = `site-issue-${site.issue_number}`;
                    try {
                        const res = await fetch(`https://api.counterapi.dev/v1/${WORKSPACE}/${key}`);
                        const data = await res.json();
                        site.votes = data.count || 0;
                    } catch (e) {
                        // If the counter doesn't exist yet, CounterAPI returns a 404, which means 0 votes
                        site.votes = 0;
                    }
                });

                // Wait for all counts to return
                await Promise.all(fetchVotesPromises);

                // 3. Sort sites dynamically by popularity
                sites.sort((a, b) => b.votes - a.votes);

                // 4. Render the site cards with an instant-vote action
                sites.forEach(site => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-xl shadow-md border border-gray-200 flex justify-between items-center hover:shadow-lg transition";
                    card.innerHTML = `
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">${site.title}</h3>
                            <a href="${site.url}" target="_blank" class="text-indigo-500 hover:underline text-sm break-all">${site.url}</a>
                        </div>
                        
                        <button onclick="castVote('${site.issue_number}', this)" 
                                class="flex flex-col items-center bg-gray-50 hover:bg-indigo-50 border border-gray-300 hover:border-indigo-400 p-3 rounded-lg transition group min-w-[75px] cursor-pointer">
                            <span class="text-xl group-hover:scale-125 transition-transform">👍</span>
                            <span class="count-display text-sm font-bold text-gray-700 mt-1">${site.votes}</span>
                        </button>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Application error:", err);
                document.getElementById('sites-container').innerHTML = `<p class="text-red-500">Failed to sync live data.</p>`;
            }
        }

        // 5. The Instant Voting Engine
        async function castVote(issueNumber, buttonElement) {
            // Prevent spam double-clicks while the request is processing
            buttonElement.disabled = true;
            
            const key = `site-issue-${issueNumber}`;
            const countDisplay = buttonElement.querySelector('.count-display');
            
            try {
                // Call CounterAPI's "up" endpoint to increment the counter by 1
                const res = await fetch(`https://api.counterapi.dev/v1/${WORKSPACE}/${key}/up`);
                const data = await res.json();
                
                // Update the UI text immediately!
                if (data && data.count !== undefined) {
                    countDisplay.textContent = data.count;
                    
                    // Optional visual feedback
                    buttonElement.classList.remove('bg-gray-50');
                    buttonElement.classList.add('bg-green-50', 'border-green-400');
                }
            } catch (err) {
                console.error("Voting failed:", err);
            } finally {
                // Re-enable the button
                buttonElement.disabled = false;
            }
        }

        init();
    </script>
</body>
</html>
